<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a0a0a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#cc3333;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#cc3333;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g stroke="#cc3333" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="0" x2="1920" y2="0"/>
    <line x1="0" y1="80" x2="1920" y2="80"/>
    <line x1="0" y1="160" x2="1920" y2="160"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="320" x2="1920" y2="320"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="560" x2="1920" y2="560"/>
    <line x1="0" y1="640" x2="1920" y2="640"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="0" y1="880" x2="1920" y2="880"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="0" y1="1040" x2="1920" y2="1040"/>
    <line x1="0" y1="0" x2="0" y2="1080"/>
    <line x1="160" y1="0" x2="160" y2="1080"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
  </g>

  <!-- Logo -->
  <g transform="translate(960,400)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#cc3333" stroke-width="4" opacity="0.6"/>
    <line x1="-50" y1="-50" x2="50" y2="50" stroke="#cc3333" stroke-width="20" stroke-linecap="round"/>
    <line x1="50" y1="-50" x2="-50" y2="50" stroke="#cc3333" stroke-width="20" stroke-linecap="round"/>
    <path d="M0 -75 L75 -45 L75 40 Q75 100 0 140 Q-75 100 -75 40 L-75 -45 Z"
          fill="none" stroke="#cc3333" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="960" y="620" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="bold"
        fill="#cc3333" text-anchor="middle" letter-spacing="12" opacity="0.9">XUBH OS</text>
  <text x="960" y="670" font-family="DejaVu Sans, sans-serif" font-size="22"
        fill="#666666" text-anchor="middle" letter-spacing="6">PENETRATION TESTING DISTRIBUTION</text>

  <!-- Terminal lines decoration -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#cc3333" opacity="0.15">
    <text x="200" y="800">root@xubh:~# nmap -sV -sC -A 10.0.0.0/24</text>
    <text x="200" y="830">root@xubh:~# msfconsole -q</text>
    <text x="200" y="860">root@xubh:~# hashcat -m 0 -a 0 hash.txt rockyou.txt</text>
    <text x="200" y="890">root@xubh:~# wifite --all</text>
    <text x="1100" y="800">root@xubh:~# sqlmap -u "http://target.com/page?id=1" --batch</text>
    <text x="1100" y="830">root@xubh:~# gobuster dir -u http://target.com -w wordlist.txt</text>
    <text x="1100" y="860">root@xubh:~# responder -I eth0</text>
    <text x="1100" y="890">root@xubh:~# bettercap -eval "net.probe on"</text>
  </g>
</svg>
