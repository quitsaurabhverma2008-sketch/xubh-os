# Xubh OS isolinux configuration
serial 0
default vesamenu.c32
prompt 0
timeout 300

MENU TITLE Xubh OS
MENU BACKGROUND splash.png

menu color screen       37;40      #80ffffff #00000000 none
menu color border       30;44      #40ffffff #00000000 none
menu color title        1;36;41    #ff333333 #00000000 none
menu color unsel        37;44      #ffcccccc #00000000 none
menu color hotkey       1;37;44    #ffff6600 #00000000 none
menu color sel          7;37;47    #ff333333 #ffffffff none
menu color hotsel       1;7;37;47  #ffff6600 #ffffffff none
menu color scrollbar    30;44      #40000000 #00000000 none
menu color tabmsg       31;40      #ffcccccc #00000000 none
menu color cmdline      37;40      #ffcccccc #00000000 none
menu color msg          37;40      #ffcccccc #00000000 none
menu color help         37;40      #ffcccccc #00000000 none

include live.cfg
